[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = []
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
purechain = "https://purechainnode.com:8547"
